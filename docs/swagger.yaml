basePath: /api/v1
definitions:
  dto.EmailNotVerifiedResponse:
    properties:
      code:
        example: EMAIL_NOT_VERIFIED
        type: string
      error:
        example: email not verified
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      error:
        example: invalid email or password
        type: string
    type: object
  dto.ForgotPassword:
    properties:
      email:
        example: john@test.com
        maxLength: 255
        type: string
    required:
    - email
    type: object
  dto.Login:
    properties:
      email:
        example: john@test.com
        maxLength: 255
        type: string
      password:
        example: Str0ngP@ssw0rd!
        maxLength: 128
        minLength: 1
        type: string
    required:
    - email
    - password
    type: object
  dto.Me:
    properties:
      email:
        example: john@test.com
        type: string
      emailVerified:
        example: true
        type: boolean
      id:
        example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
        type: string
      profile:
        $ref: '#/definitions/dto.Profile'
    type: object
  dto.Message:
    properties:
      message:
        example: Verification email sent
        type: string
    type: object
  dto.Profile:
    properties:
      firstName:
        example: John
        type: string
      lastName:
        example: Doe
        type: string
    type: object
  dto.Refresh:
    properties:
      refreshToken:
        example: a3f1c9e2b4d60718293a4b5c6d7e8f09a1b2c3d4e5f60718293a4b5c6d7e8f0
        minLength: 1
        type: string
    required:
    - refreshToken
    type: object
  dto.Register:
    properties:
      email:
        example: john@test.com
        maxLength: 255
        type: string
      firstName:
        example: John
        maxLength: 100
        type: string
      lastName:
        example: Doe
        maxLength: 100
        type: string
      password:
        example: Str0ngP@ssw0rd!
        maxLength: 128
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  dto.ResendVerification:
    properties:
      email:
        example: john@test.com
        maxLength: 255
        type: string
    required:
    - email
    type: object
  dto.ResetPassword:
    properties:
      newPassword:
        example: N3wStr0ngP@ss!
        maxLength: 128
        minLength: 8
        type: string
      token:
        example: c8f3e2d1b0a94731d4e5f6a708192b3c4d5e6f708192a3b4c5d6e7f8091b2
        minLength: 1
        type: string
    required:
    - newPassword
    - token
    type: object
  dto.TokenPair:
    properties:
      accessToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxYTIzYiJ9.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
        type: string
      refreshToken:
        example: a3f1c9e2b4d60718293a4b5c6d7e8f09a1b2c3d4e5f60718293a4b5c6d7e8f0
        type: string
    type: object
  dto.VerifyByCode:
    properties:
      code:
        example: "482910"
        type: string
      email:
        example: john@test.com
        maxLength: 255
        type: string
    required:
    - code
    - email
    type: object
  dto.VerifyEmail:
    properties:
      token:
        example: b7e2d1c0a9f84620c3d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3
        minLength: 1
        type: string
    required:
    - token
    type: object
host: localhost:8080
info:
  contact: {}
  description: MVP multi-tenant event platform. Auth owns user identity; org membership
    and permissions live in organization/iam.
  title: Rallya API
  version: "1.0"
paths:
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Invalidates prior reset tokens and emails a 1h single-use link
        if the account exists. Always returns 200.
      parameters:
      - description: Email payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPassword'
      produces:
      - application/json
      responses:
        "200":
          description: If the email exists, a reset link was sent
          schema:
            $ref: '#/definitions/dto.Message'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Request password reset
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Verifies the bcrypt password, enforces ACTIVE status + verified
        email, then returns an access JWT and a rotating refresh token.
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.Login'
      - description: Device label for the session
        example: Chrome Laptop
        in: header
        name: X-Device-Name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Access + refresh tokens
          schema:
            $ref: '#/definitions/dto.TokenPair'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Email not verified / account suspended
          schema:
            $ref: '#/definitions/dto.EmailNotVerifiedResponse'
        "500":
          description: Login failed
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      description: Revokes the session bound to the access token plus its refresh
        rows.
      parameters:
      - description: Bearer access token
        example: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxYTIzYiJ9.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Logged out
          schema:
            $ref: '#/definitions/dto.Message'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Logout failed
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Log out current session
      tags:
      - auth
  /auth/me:
    get:
      description: Returns id, email, verification flag, and profile names for the
        access-token owner.
      parameters:
      - description: Bearer access token
        example: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxYTIzYiJ9.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Current user
          schema:
            $ref: '#/definitions/dto.Me'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 'Single-use rotation: the presented token is revoked and a new
        pair issued. Reuse triggers session-wide revocation.'
      parameters:
      - description: Refresh payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.Refresh'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TokenPair'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Rotate refresh token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates the identity, hashes the password with bcrypt, and emails
        a 24h verification link. Login is blocked until verified.
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.Register'
      produces:
      - application/json
      responses:
        "201":
          description: Verification email sent
          schema:
            $ref: '#/definitions/dto.Message'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Email already registered
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Registration failed
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /auth/resend-verification:
    post:
      consumes:
      - application/json
      description: Issues a fresh 24h verification token. Throttled (60s). Unknown
        emails still return 200 to avoid enumeration.
      parameters:
      - description: Email payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResendVerification'
      produces:
      - application/json
      responses:
        "200":
          description: Verification email sent
          schema:
            $ref: '#/definitions/dto.Message'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Resend failed
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Resend verification email
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Single-use 1h token. On success all sessions + refresh tokens are
        revoked.
      parameters:
      - description: Reset payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPassword'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset successful
          schema:
            $ref: '#/definitions/dto.Message'
        "400":
          description: Invalid or expired token
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Token already used
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Reset failed
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Reset password
      tags:
      - auth
  /auth/verify-code:
    post:
      consumes:
      - application/json
      description: Confirms email ownership with the 6-digit code from the verification
        email. Codes expire after 10 minutes and allow 5 attempts.
      parameters:
      - description: OTP payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyByCode'
      produces:
      - application/json
      responses:
        "200":
          description: Email verified
          schema:
            $ref: '#/definitions/dto.Message'
        "400":
          description: Invalid or expired code
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too many wrong codes
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Verification failed
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Verify email with OTP code
      tags:
      - auth
  /auth/verify-email:
    post:
      consumes:
      - application/json
      description: Confirms email ownership. Tokens are single-use and expire after
        24h.
      parameters:
      - description: Verification payload
        in: body
        name: request
        schema:
          $ref: '#/definitions/dto.VerifyEmail'
      - description: Verification token (email link fallback)
        example: b7e2d1c0a9f84620c3d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3
        in: query
        name: token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Email verified
          schema:
            $ref: '#/definitions/dto.Message'
        "400":
          description: Invalid or expired token
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Token already used
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Verification failed
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Verify email address
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    description: '"Bearer <accessToken> from POST /auth/login (or /auth/refresh)."'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
