# RALLYA CASBIN MODEL — RBAC with domains (tenants).
#
# Request:  sub (user UUID string), dom (org UUID string), obj (resource), act (action)
# Policy:   p, sub (role or user), dom (org UUID or *), obj, act
# Grouping: g, user UUID, role, org UUID        (membership -> role, per org)
#           g2, user UUID, superadmin            (platform superadmin, domain-less)
#
# Superadmin bypasses every domain check. Everyone else must match role,
# domain, object, and action (OWNER relies on the per-org *,* wildcard).

[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[role_definition]
g = _, _, _
g2 = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g2(r.sub, "superadmin") || g(r.sub, p.sub, r.dom) && (r.dom == p.dom || p.dom == "*") && (r.obj == p.obj || p.obj == "*") && (r.act == p.act || p.act == "*")
