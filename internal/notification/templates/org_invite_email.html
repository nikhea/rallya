<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You are invited to {{ .OrgName }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f4f6;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="background-color:#4f46e5;padding:24px 32px;text-align:center;">
              <h1 style="margin:0;color:#ffffff;font-size:22px;">{{ .AppName }}</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h2 style="margin:0 0 8px;font-size:20px;color:#111827;">You are invited to {{ .OrgName }}</h2>
              <p style="margin:0 0 16px;font-size:14px;line-height:1.6;color:#4b5563;">Hi {{ .Name }},</p>
              <p style="margin:0 0 16px;font-size:14px;line-height:1.6;color:#4b5563;">{{ .InviterName }} invited you to join <strong>{{ .OrgName }}</strong> as <strong>{{ .Role }}</strong>. This invite is valid for 7 days.</p>
              <div style="text-align:center;margin:24px 0;">
                <a href="{{ .InviteLink }}" style="display:inline-block;background-color:#4f46e5;color:#ffffff;text-decoration:none;font-size:14px;font-weight:bold;border-radius:8px;padding:12px 28px;">Accept invite</a>
              </div>
              <p style="margin:0;font-size:12px;line-height:1.6;color:#9ca3af;">If you don't want to join, you can ignore this email.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px;background-color:#f9fafb;text-align:center;">
              <p style="margin:0;font-size:12px;color:#9ca3af;">&copy; {{ .AppName }}. All rights reserved.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
